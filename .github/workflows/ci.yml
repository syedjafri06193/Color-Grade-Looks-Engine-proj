name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenColorIO
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libopencolorio-dev
          else
            brew install opencolorio
          fi
      - name: Install Python tooling
        run: python -m pip install -r tools/preset_validator/requirements.txt
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$(brew --prefix 2>/dev/null || echo /usr)"
          cmake --build build
      - name: Tests (preset schema and pack checks)
        run: ctest --test-dir build --output-on-failure
      - name: Bundled OCIO config validates
        run: ./build/tools/ocio_inspector/ocio_inspector assets/ocio/config.ocio
      - name: Starter pack packages
        run: python tools/preset_packager/main.py assets/presets/packs/starter_pack starter_pack.zip
